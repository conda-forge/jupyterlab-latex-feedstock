schema_version: 1

context:
  name: jupyterlab-latex
  version: "4.4.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/jupyterlab/jupyterlab-latex/archive/v${{ version }}.tar.gz
  sha256: 10553c1df6889ede0a60e77e85d88e2543e19a810391f7448f10e3b5d8349871

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - jupyter_packaging >=0.12,<1.dev0,<2
    - jupyterlab ==4.0.0
    - nodejs =18
    - pip
    - hatchling
    - hatch-nodejs-version
    - hatch-jupyter-builder
  run:
    - python >=${{ python_min }}
    - jupyterlab >=4,<5
    - jupyter_server >=2,<3

tests:
  - python:
      imports:
        - jupyterlab_latex
      pip_check: true
      python_version: ${{ python_min }}

about:
  license: BSD-3-Clause
  license_file: LICENSE
  summary: JupyterLab extension for live editing of LaTeX documents
  description: |
    An extension for JupyterLab which allows for live-editing of LaTeX
    documents.
  homepage: http://jupyter.org
  repository: https://github.com/jupyterlab/jupyterlab-latex
  documentation: https://github.com/jupyterlab/jupyterlab-latex/blob/master/docs/advanced.md

extra:
  recipe-maintainers:
    - jan-janssen
